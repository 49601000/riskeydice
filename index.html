<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>仮想リスキーダイス</title>
  <link rel="apple-touch-icon" href="./apple-touch-icon-rdice.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon-rdice.png">
  <meta name="apple-mobile-web-app-title" content="RiskeyDices">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #111;
      font-family: 'Noto Serif JP', serif;
      color: #eee;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .header {
      font-size: 13px;
      letter-spacing: 6px;
      color: #555;
      margin-bottom: 40px;
    }

    .card {
      width: 280px;
      border: 1px solid #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 32px 40px;
      position: relative;
      min-height: 200px;
    }

    .card::before {
      content: '';
      position: absolute;
      inset: 6px;
      border: 1px solid #2a2a2a;
      pointer-events: none;
    }

    .fortune-text {
      font-size: 64px;
      font-weight: 900;
      letter-spacing: 8px;
      line-height: 1;
      color: #eee;
    }

    .fortune-text.daikyo { color: #cc2200; }
    .dash { color: #333; }

    .roll-btn {
      width: 280px;
      margin-top: 28px;
      padding: 20px;
      background: #111;
      color: #fff;
      font-family: 'Noto Serif JP', serif;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 8px;
      border: 2px solid #fff;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, transform 0.1s;
    }

    .roll-btn:hover { background: #fff; color: #111; }
    .roll-btn:active { transform: scale(0.97); }

    .count {
      margin-top: 20px;
      font-size: 11px;
      letter-spacing: 4px;
      color: #333;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.88); }
      to   { opacity: 1; transform: scale(1); }
    }

    .revealed { animation: fadeIn 0.35s cubic-bezier(0.22, 1, 0.36, 1); }
  </style>
</head>
<body>

  <div class="header">仮 想 リ ス キ ー ダ イ ス</div>

  <div class="card">
    <div class="fortune-text dash" id="fortuneText">——</div>
  </div>

  <button class="roll-btn" id="rollBtn" onclick="roll()">サイコロを<br>振る</button>
  <div class="count" id="countLabel"></div>

  <script>
    let total = 0, daikyo = 0, daikichi = 0;

    function roll() {
      const n = Math.floor(Math.random() * 20) + 1;
      total++;

      const ft = document.getElementById('fortuneText');

      ft.classList.remove('revealed', 'daikyo', 'dash');
      void ft.offsetWidth;
      ft.classList.add('revealed');

      if (n === 1) {
        daikyo++;
        ft.textContent = '大凶';
        ft.classList.add('daikyo');
      } else {
        daikichi++;
        ft.textContent = '大吉';
      }

      document.getElementById('countLabel').textContent =
        `${total}回中　大吉 ${daikichi}　大凶 ${daikyo}`;
    }
  </script>

</body>
</html>
