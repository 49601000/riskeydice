<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ダイスロールシミュレーター</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0f;
            --surface: #111118;
            --surface2: #1a1a24;
            --border: #2a2a3a;
            --accent: #7c6fff;
            --accent2: #ff6f91;
            --accent-glow: rgba(124, 111, 255, 0.4);
            --text: #e8e8f0;
            --text-dim: #6a6a8a;
            --success: #6fffc8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Noto Sans JP', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* 背景の幾何学パターン */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                radial-gradient(ellipse 60% 40% at 20% 20%, rgba(124,111,255,0.08) 0%, transparent 60%),
                radial-gradient(ellipse 40% 60% at 80% 80%, rgba(255,111,145,0.06) 0%, transparent 60%);
            pointer-events: none;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background-image: 
                repeating-linear-gradient(0deg, transparent, transparent 59px, rgba(255,255,255,0.02) 60px),
                repeating-linear-gradient(90deg, transparent, transparent 59px, rgba(255,255,255,0.02) 60px);
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 480px;
            padding: 20px;
        }

        /* ヘッダー */
        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header .eyebrow {
            font-family: 'Orbitron', monospace;
            font-size: 10px;
            letter-spacing: 6px;
            color: var(--accent);
            text-transform: uppercase;
            margin-bottom: 12px;
            opacity: 0.8;
        }

        .header h1 {
            font-family: 'Orbitron', monospace;
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.2;
        }

        /* メインカード */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 36px 32px;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            opacity: 0.6;
        }

        /* 入力グループ */
        .inputs-row {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 12px;
            align-items: center;
            margin-bottom: 24px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-label {
            font-size: 10px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--text-dim);
            font-family: 'Orbitron', monospace;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper input {
            width: 100%;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            font-family: 'Orbitron', monospace;
            font-size: 26px;
            font-weight: 700;
            text-align: center;
            padding: 14px 10px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            -moz-appearance: textfield;
        }

        .input-wrapper input::-webkit-inner-spin-button,
        .input-wrapper input::-webkit-outer-spin-button {
            -webkit-appearance: none;
        }

        .input-wrapper input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow), inset 0 0 20px rgba(124,111,255,0.05);
        }

        .stepper {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .stepper button {
            background: var(--border);
            border: none;
            color: var(--text-dim);
            width: 20px;
            height: 18px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s, color 0.15s;
            padding: 0;
        }

        .stepper button:hover {
            background: var(--accent);
            color: #fff;
        }

        /* 区切り */
        .divider-d {
            font-family: 'Orbitron', monospace;
            font-size: 32px;
            font-weight: 900;
            color: var(--accent2);
            text-align: center;
            margin-top: 24px;
            text-shadow: 0 0 20px rgba(255,111,145,0.5);
        }

        /* プリセットボタン */
        .presets {
            margin-bottom: 24px;
        }

        .presets-label {
            font-size: 10px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--text-dim);
            font-family: 'Orbitron', monospace;
            margin-bottom: 10px;
            display: block;
        }

        .preset-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .preset-btn {
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--text-dim);
            font-family: 'Orbitron', monospace;
            font-size: 11px;
            font-weight: 700;
            padding: 7px 14px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 1px;
        }

        .preset-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            box-shadow: 0 0 12px var(--accent-glow);
        }

        /* ロールボタン */
        .roll-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, var(--accent) 0%, #9d6fff 50%, var(--accent2) 100%);
            background-size: 200% 200%;
            border: none;
            border-radius: 14px;
            color: #fff;
            font-family: 'Orbitron', monospace;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.2s, background-position 0.4s;
            box-shadow: 0 4px 24px rgba(124,111,255,0.4);
            position: relative;
            overflow: hidden;
            margin-bottom: 28px;
        }

        .roll-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(124,111,255,0.6);
            background-position: right center;
        }

        .roll-btn:active {
            transform: translateY(0) scale(0.98);
        }

        .roll-btn.rolling {
            animation: rollPulse 0.4s ease;
        }

        @keyframes rollPulse {
            0% { transform: scale(1); }
            30% { transform: scale(0.96); }
            70% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        /* 結果エリア */
        .result-area {
            min-height: 100px;
            border-top: 1px solid var(--border);
            padding-top: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .result-empty {
            color: var(--text-dim);
            font-size: 13px;
            letter-spacing: 2px;
            font-family: 'Orbitron', monospace;
        }

        .result-rolls {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            max-height: 120px;
            overflow-y: auto;
        }

        .die-chip {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 6px 12px;
            font-family: 'Orbitron', monospace;
            font-size: 14px;
            font-weight: 700;
            color: var(--text);
            animation: chipIn 0.2s ease backwards;
        }

        .die-chip.max {
            border-color: var(--success);
            color: var(--success);
            box-shadow: 0 0 10px rgba(111,255,200,0.2);
        }

        .die-chip.min {
            border-color: var(--accent2);
            color: var(--accent2);
        }

        @keyframes chipIn {
            from { opacity: 0; transform: scale(0.7) translateY(8px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .result-total {
            font-family: 'Orbitron', monospace;
            font-size: 52px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--success), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: totalIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            line-height: 1;
        }

        @keyframes totalIn {
            from { opacity: 0; transform: scale(0.5); }
            to { opacity: 1; transform: scale(1); }
        }

        .result-label {
            font-size: 10px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--text-dim);
            font-family: 'Orbitron', monospace;
        }

        .result-formula {
            font-size: 12px;
            color: var(--text-dim);
            font-family: 'Orbitron', monospace;
        }

        .error-msg {
            color: var(--accent2);
            font-size: 13px;
            font-family: 'Noto Sans JP', sans-serif;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="eyebrow">Dice Roll Simulator</div>
            <h1>ダイスロール</h1>
        </div>

        <div class="card">
            <!-- 入力 -->
            <div class="inputs-row">
                <div class="input-group">
                    <span class="input-label">個数</span>
                    <div class="input-wrapper">
                        <input type="number" id="numDice" value="1" min="1" max="100">
                        <div class="stepper">
                            <button onclick="step('numDice', 1)">▲</button>
                            <button onclick="step('numDice', -1)">▼</button>
                        </div>
                    </div>
                </div>

                <div class="divider-d">d</div>

                <div class="input-group">
                    <span class="input-label">面数</span>
                    <div class="input-wrapper">
                        <input type="number" id="sides" value="6" min="6" max="200">
                        <div class="stepper">
                            <button onclick="step('sides', 1)">▲</button>
                            <button onclick="step('sides', -1)">▼</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- プリセット -->
            <div class="presets">
                <span class="presets-label">プリセット</span>
                <div class="preset-grid" id="presetGrid"></div>
            </div>

            <!-- ボタン -->
            <button class="roll-btn" id="rollBtn" onclick="rollDice()">ROLL</button>

            <!-- 結果 -->
            <div class="result-area" id="resultArea">
                <span class="result-empty">— ダイスをロールしてください —</span>
            </div>
        </div>
    </div>

    <script>
        const PRESETS = [
            { label: '1d4', n: 1, s: 4 },
            { label: '1d6', n: 1, s: 6 },
            { label: '1d8', n: 1, s: 8 },
            { label: '1d10', n: 1, s: 10 },
            { label: '1d12', n: 1, s: 12 },
            { label: '1d20', n: 1, s: 20 },
            { label: '1d100', n: 1, s: 100 },
            { label: '2d6', n: 2, s: 6 },
            { label: '3d6', n: 3, s: 6 },
            { label: '4d6', n: 4, s: 6 },
        ];

        // プリセット生成
        const grid = document.getElementById('presetGrid');
        PRESETS.forEach(p => {
            const btn = document.createElement('button');
            btn.className = 'preset-btn';
            btn.textContent = p.label;
            btn.onclick = () => {
                document.getElementById('numDice').value = p.n;
                document.getElementById('sides').value = p.s;
            };
            grid.appendChild(btn);
        });

        function step(id, delta) {
            const el = document.getElementById(id);
            const val = parseInt(el.value) || 0;
            const min = parseInt(el.min);
            const max = parseInt(el.max);
            el.value = Math.min(max, Math.max(min, val + delta));
        }

        function rollDice() {
            const numDice = parseInt(document.getElementById('numDice').value);
            const sides = parseInt(document.getElementById('sides').value);
            const area = document.getElementById('resultArea');
            const btn = document.getElementById('rollBtn');

            // バリデーション
            if (isNaN(numDice) || numDice < 1 || numDice > 100) {
                area.innerHTML = '<p class="error-msg">ダイス数は1〜100で指定してください。</p>';
                return;
            }
            if (isNaN(sides) || sides < 2 || sides > 200) {
                area.innerHTML = '<p class="error-msg">面数は2〜200で指定してください。</p>';
                return;
            }

            // ボタンアニメ
            btn.classList.remove('rolling');
            void btn.offsetWidth;
            btn.classList.add('rolling');

            // ロール
            let total = 0;
            let rolls = [];
            for (let i = 0; i < numDice; i++) {
                const r = Math.floor(Math.random() * sides) + 1;
                rolls.push(r);
                total += r;
            }

            // チップ生成
            const chips = rolls.map((r, i) => {
                let cls = 'die-chip';
                if (r === sides) cls += ' max';
                else if (r === 1) cls += ' min';
                const delay = Math.min(i * 0.04, 0.5);
                return `<div class="${cls}" style="animation-delay:${delay}s">${r}</div>`;
            }).join('');

            const formula = numDice > 1
                ? `<div class="result-formula">${rolls.join(' + ')} = ${total}</div>`
                : '';

            area.innerHTML = `
                <div class="result-label">${numDice}d${sides} の結果</div>
                <div class="result-total">${total}</div>
                ${formula}
                ${numDice > 1 ? `<div class="result-rolls">${chips}</div>` : ''}
            `;
        }

        // Enterキー対応
        document.addEventListener('keydown', e => {
            if (e.key === 'Enter') rollDice();
        });
    </script>
</body>
</html>
